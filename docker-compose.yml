services:
  # ── Custom Gotenberg with Thai fonts ────────────────────────────────────────
  gotenberg:
    build:
      context: .
      dockerfile: gotenberg.Dockerfile   # Our custom image with bundled fonts
    container_name: gotenberg
    restart: unless-stopped
    ports:
      - "3010:3000"
    environment:
      - GOTENBERG_LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: report-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GOTENBERG_URL=http://gotenberg:3000
    volumes:
      - ./static/uploads:/app/static/uploads
      - ./temp_convert:/app/temp_convert
      - .:/app
    depends_on:
      gotenberg:
        condition: service_healthy
