<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <dir>/usr/share/fonts/custom</dir>

  <alias>
    <family>TH Sarabun New</family>
    <prefer>
      <family>TH Sarabun New</family>
      <family>Sarabun</family>
    </prefer>
  </alias>

  <alias>
    <family>Angsana New</family>
    <prefer>
      <family>AngsanaUPC</family>
      <family>TH Sarabun New</family>
    </prefer>
  </alias>

  <alias>
    <family>Cordia New</family>
    <prefer>
      <family>CordiaUPC</family>
      <family>TH Sarabun New</family>
    </prefer>
  </alias>

  <alias>
    <family>Calibri</family>
    <prefer>
      <family>Calibri</family>
      <family>Arial</family>
      <family>Liberation Sans</family>
    </prefer>
  </alias>

  <alias>
    <family>Tahoma</family>
    <prefer>
      <family>Tahoma</family>
      <family>Arial</family>
      <family>Liberation Sans</family>
    </prefer>
  </alias>

  <alias>
    <family>Times New Roman</family>
    <prefer>
      <family>Times New Roman</family>
      <family>Liberation Serif</family>
    </prefer>
  </alias>
</fontconfig>
